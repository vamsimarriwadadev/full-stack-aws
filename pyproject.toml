[project]
name = "indian"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.114",
    "botocore[crt]>=1.43.114",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-aws>=1.9.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-aws>=1.2.5",
    "pgvector>=0.3.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
